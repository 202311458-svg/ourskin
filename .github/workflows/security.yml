name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-critical-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite+pysqlite:///:memory:
      SECRET_KEY: ci-only-synthetic-signing-key-at-least-32-bytes
      JWT_ISSUER: os-coms-test
      JWT_AUDIENCE: os-coms-test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app init_db.py tests
      - run: pytest

  postgres-migration-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ourskin
          POSTGRES_PASSWORD: ourskin-ci
          POSTGRES_DB: ourskin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourskin -d ourskin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg2://ourskin:ourskin-ci@127.0.0.1:5432/ourskin_ci
      SECRET_KEY: ci-only-synthetic-signing-key-at-least-32-bytes
      JWT_ISSUER: os-coms-test
      JWT_AUDIENCE: os-coms-test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Upgrade empty PostgreSQL database to head
        run: alembic upgrade head
      - name: Verify database is at Alembic head
        run: |
          CURRENT=$(alembic current | tail -n 1)
          HEAD=$(alembic heads | tail -n 1 | awk '{print $1}')
          echo "Current: $CURRENT"
          echo "Head: $HEAD"
          echo "$CURRENT" | grep -q "$HEAD"

  frontend-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
